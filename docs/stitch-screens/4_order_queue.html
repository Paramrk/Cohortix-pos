<body class="bg-background text-on-background min-h-screen font-body-md text-body-md antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- TopAppBar -->

<input class="w-full h-full pl-12 pr-4 bg-surface-container-lowest border border-outline-variant rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md text-body-md text-on-surface transition-all placeholder:text-outline shadow-sm" placeholder="Search order number or name..." type="text"/>
</div>
<!-- Filter Chips Carousel -->
<div class="flex overflow-x-auto gap-sm mb-lg no-scrollbar pb-xs">
<button class="h-[36px] px-md rounded-full bg-primary text-on-primary font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform">

<button class="h-[36px] px-md rounded-full bg-surface-container-lowest text-on-surface-variant border border-outline-variant font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform hover:bg-surface-container-low">

<button class="h-[36px] px-md rounded-full bg-surface-container-lowest text-on-surface-variant border border-outline-variant font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform hover:bg-surface-container-low">
                Ready

                Pending

</div>
<!-- Order List -->

<!-- Order Card: Ready -->

</div>
</div>
</div>

<!-- Simple interaction script to mimic chip selection -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.overflow-x-auto button');
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    // Reset all
                    chips.forEach(c => {
                        c.className = "h-[36px] px-md rounded-full bg-surface-container-lowest text-on-surface-variant border border-outline-variant font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform hover:bg-surface-container-low";
                    });
                    // Set active
                    chip.className = "h-[36px] px-md rounded-full bg-primary text-on-primary font-label-md text-label-md whitespace-nowrap active:scale-95 transition-transform";
                });
            });
        });
    </script>
